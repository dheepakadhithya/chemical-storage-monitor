<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemical Management - SafeChem</title>
    <link rel="stylesheet" href="style.css?v=white">
    <link rel="stylesheet" href="ai-assistant.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .chemicals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .chem-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .chem-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        .chem-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .chem-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #1e293b;
            margin: 0;
        }

        .chem-formula {
            display: inline-block;
            font-size: 0.82rem;
            font-family: monospace;
            background: #f1f5f9;
            color: #475569;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 4px;
        }

        .chem-limits {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            background: #f8fafc;
            border-radius: 8px;
            padding: 0.75rem;
            margin: 1rem 0;
            text-align: center;
        }

        .limit-box-title {
            font-size: 0.75rem;
            color: #1e293b;
            text-transform: uppercase;
            font-weight: 700;
        }

        .limit-box-val {
            font-size: 1.05rem;
            font-weight: 700;
            color: #0f172a;
            margin-top: 2px;
        }

        .chem-instructions {
            font-size: 0.85rem;
            color: #1e293b;
            margin-bottom: 1.25rem;
            line-height: 1.4;
            flex-grow: 1;
            font-weight: 500;
        }

        .chem-card-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 1rem;
        }

        .btn-view-action {
            flex: 1;
            background: #333333;
            color: white;
            border: none;
            padding: 0.55rem 0.85rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            transition: background 0.2s;
        }

        .btn-view-action:hover {
            background: #222222;
        }

        .btn-edit-action {
            flex: 1;
            background: #f8fafc;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            padding: 0.55rem 0.85rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            transition: all 0.2s;
        }

        .btn-edit-action:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .btn-delete-chem {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            padding: 0.55rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-delete-chem:hover {
            background: #fecaca;
        }

        /* Form Modal */
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
            color: #334155;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.9rem;
            box-sizing: border-box;
            outline: none;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }
    </style>
</head>
<body>
    <!-- Sidebar Navigation (Referenced from downloads/project) -->
    <div id="sidebar-backdrop"></div>
    <nav id="sidebar">
        <div id="sidebar-header">
            <span><i class="fa-solid fa-shield-halved" style="color: #38bdf8; margin-right: 8px;"></i> SafeChem</span>
            <span id="sidebar-close">&times;</span>
        </div>
        <ul>
            <li><a href="index.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a></li>
            <li><a href="chemicals.html" class="active"><i class="fa-solid fa-flask-vial"></i> Chemicals</a></li>
            <li><a href="users.html"><i class="fa-solid fa-users-gear"></i> Users</a></li>
        </ul>
        <div id="sidebar-footer">
            <a href="/logout" style="color: #ef4444; text-decoration: none; display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
            </a>
        </div>
    </nav>

    <!-- Full-width edge-to-edge Top Header (No Margins) -->
    <header>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <div id="menuIcon" title="Open Navigation Menu">&#9776;</div>
            <h1>Chemical Profiles & Thresholds</h1>
        </div>
        <div class="header-user-profile" title="Current authenticated user">
            <div class="header-user-details">
                <span id="headerUserName" class="header-user-name">--</span>
                <span id="headerUserRole" class="header-user-role-badge">USER</span>
            </div>
            <img id="headerUserAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=80" alt="User" class="header-user-avatar">
        </div>
    </header>

    <div class="dashboard-container">

        <!-- Top Controls: Title, Guidance, Search Bar & Add Chemical Button -->
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.25rem;">
            <div>
                <h2 style="margin: 0; color: #1e293b; font-size: 1.3rem;">Safety Profiles Catalog</h2>
                <p style="color: #1e293b; margin: 0.25rem 0 0 0; font-size: 0.9rem; font-weight: 500;">Manage chemical profiles and storage limits. Use <strong>View</strong> for live safety telemetry or <strong>Edit</strong> to configure threshold limits.</p>
            </div>
            <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
                <div class="search-bar-wrapper">
                    <i class="fa-solid fa-magnifying-glass" style="color: #1e293b;"></i>
                    <input type="text" id="chemicalSearchInput" placeholder="Search chemicals by name or formula...">
                </div>
                <button id="add-chem-btn" class="btn" style="background: #333333; color: white;">
                    Add Chemical
                </button>
            </div>
        </div>

        <!-- Chemicals Cards Grid -->
        <div id="chemicals-grid" class="chemicals-grid">
            <p style="color: #1e293b; font-weight: 500;">Loading chemical profiles...</p>
        </div>
    </div>

    <!-- Add / Edit Chemical Modal -->
    <div id="chem-modal" class="modal">
        <div class="modal-content" style="max-width: 550px;">
            <span class="close-btn" id="modal-close">&times;</span>
            <h2 id="modal-title"><i class="fa-solid fa-flask"></i> Add Chemical Profile</h2>
            <form id="chem-form">
                <input type="hidden" id="edit-chem-id" value="">
                
                <div class="form-group">
                    <label>Chemical Name *</label>
                    <input type="text" id="chem-name" required placeholder="e.g. Isopropanol (99%)">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Formula</label>
                        <input type="text" id="chem-formula" placeholder="e.g. C3H8O">
                    </div>
                    <div class="form-group">
                        <label>Hazard Category *</label>
                        <input type="text" id="chem-hazard" required placeholder="e.g. Flammable Liquid">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Max Safe Temp (°C) *</label>
                        <input type="number" step="0.1" id="chem-max-temp" required placeholder="e.g. 28.0">
                    </div>
                    <div class="form-group">
                        <label>Max Safe Humidity (%) *</label>
                        <input type="number" step="0.1" id="chem-max-hum" required placeholder="e.g. 65.0">
                    </div>
                </div>
                <div class="form-group">
                    <label>Image URL / Path (Optional)</label>
                    <input type="text" id="chem-image-url" placeholder="e.g. /chemical/bottle.jpg or https://...">
                </div>
                <div class="form-group">
                    <label>Storage Instructions</label>
                    <textarea id="chem-instructions" rows="3" placeholder="Storage guidelines and hazard mitigation notes..."></textarea>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
                    <button type="button" id="cancel-chem-btn" class="btn" style="background: #e2e8f0; color: #334155;">Cancel</button>
                    <button type="submit" id="submit-chem-btn" class="btn" style="background: #333333; color: white;">Save Profile</button>
                </div>
            </form>
        </div>
    </div>

    <script src="header.js"></script>
    <script src="chemicals.js"></script>
    <script src="ai-assistant.js"></script>
</body>
</html>
