spring.application.name=chemical-storage-monitor

# Server Port (Render sets $PORT dynamically, defaults to 8080 locally)
server.port=${PORT:8080}

# Datasource Configuration
# Defaults to your local MySQL for daily development ($0 cost, offline)
# When deploying to Render, set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, and SPRING_DATASOURCE_PASSWORD in Render's Environment tab
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/chemical?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:7010816140123@aA}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Ollama AI Assistant Configuration
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.2:1b}
