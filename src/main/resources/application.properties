spring.application.name=chemical-storage-monitor

# Server Port (Render sets $PORT dynamically, defaults to 8080 locally)
server.port=${PORT:8080}

# Active Profile: Defaults to 'dev' (your local MySQL, $0 cost)
# Switch to 'cloud' only when presenting to judges
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ollama AI Assistant Configuration
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.2:1b}
