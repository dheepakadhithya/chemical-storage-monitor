services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chemical-storage-monitor-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional local MySQL container if you want to run offline instead of Aiven
  mysql:
    image: mysql:8.4
    container_name: chemical-storage-monitor-mysql
    restart: unless-stopped
    profiles:
      - local-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-7010816140123@aA}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chemical}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-7010816140123@aA}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
