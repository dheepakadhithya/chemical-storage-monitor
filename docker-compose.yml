services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chemical-storage-monitor-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/chemical?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 7010816140123@aA
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:1b
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql:
    image: mysql:8.4
    container_name: chemical-storage-monitor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 7010816140123@aA
      MYSQL_DATABASE: chemical
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p7010816140123@aA"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
